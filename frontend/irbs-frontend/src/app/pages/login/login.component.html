<div class="container mt-5">
  <h2>Login</h2>

  <form (ngSubmit)="onLogin()">
    <div class="mb-3">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Enter Email"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter Password"
        class="form-control"
        required
      />
    </div>

    <button class="btn btn-primary w-100">
      Login
    </button>
  </form>
</div>
